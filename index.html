<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Dehnübung</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1b2331; --muted: #667389; --line: #dde2ea;
    --accent: #2563eb; --accent-ink: #fff; --ok: #1b8a4b; --okbg: #e3f5ea; --bad: #c2410c; --badbg: #fdeee3; --rec: #dc2626;
    --target: #1b8a4b; --targetfill: rgba(27,138,75,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --card:#1b212b; --ink:#e8ecf3; --muted:#93a0b4; --line:#2b3441; --accent:#5b8def; --accent-ink:#0b1220;
      --ok:#4cc17f; --okbg:#173325; --bad:#f0a24a; --badbg:#3a2a18; --rec:#ff6b5e; --target:#4cc17f; --targetfill:rgba(76,193,127,.25); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 12px 16px 16px; }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .chip { font: inherit; font-size: .9rem; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  section { flex: 1; display: flex; flex-direction: column; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
  .word { font-size: clamp(3rem, 18vw, 5rem); font-weight: 800; line-height: 1.1; word-break: break-word; }
  .word .first { color: var(--accent); } .word .sep { color: var(--muted); font-weight: 400; padding: 0 .06em; }
  .hint { color: var(--muted); min-height: 1.4em; font-size: .95rem; }
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 8px; }
  .status { min-height: 1.3em; color: var(--muted); font-size: .95rem; text-align: center; }
  .meter { width: 100%; max-width: 360px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--ok); transition: width .06s linear; }
  #rec { width: 100%; max-width: 360px; font: inherit; font-size: 1.2rem; font-weight: 700; padding: 20px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; touch-action: manipulation; }
  #rec.listen { background: var(--ok); color: #fff; } #rec.speak { background: var(--rec); color: #fff; } #rec:disabled { opacity: .6; }
  .fbword { text-align: center; color: var(--muted); font-size: 1rem; margin-top: 6px; }
  .verdict { font-size: 1.4rem; font-weight: 800; padding: 10px 14px; border-radius: 12px; margin: 8px 0 6px; text-align: center; }
  .verdict.ok { background: var(--okbg); color: var(--ok); } .verdict.bad { background: var(--badbg); color: var(--bad); }
  .fbtext { min-height: 1.4em; text-align: center; font-size: .98rem; margin: 0 2px 6px; }
  canvas#plot { width: 100%; height: 240px; display: block; }
  .legend { display: flex; justify-content: center; gap: 16px; font-size: .85rem; color: var(--muted); margin: 4px 0 10px; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent); vertical-align: 3px; margin-right: 6px; }
  .legend i.w { height: 10px; border: 0; background: rgba(234,138,40,.55); border-radius: 3px; vertical-align: -1px; }
  .legend i.t { height: 10px; border: 0; background: var(--targetfill); outline: 2px solid var(--target); outline-offset: -2px; border-radius: 3px; vertical-align: -1px; }
  .row { display: flex; gap: 10px; } .row button { flex: 1; }
  button.btn { font: inherit; font-weight: 600; padding: 15px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { padding: 10px 12px; border-radius: 10px; background: var(--badbg); color: var(--bad); margin: 8px 0; font-weight: 600; }
  .set label { display: block; margin: 14px 0 6px; font-weight: 600; } .set .small { font-size: .85rem; color: var(--muted); }
  select, textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  textarea { min-height: 240px; font: 15px/1.4 ui-monospace, Menlo, monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="bar" id="bar"><button class="chip" id="sylBtn">Silben</button><button class="chip" id="gear" aria-label="Einstellungen">⚙</button></div>
  <div id="banner" class="banner" hidden></div>

  <section id="screenMain">
    <div class="center"><div class="word" id="word">…</div><div class="hint" id="hint"></div></div>
    <div class="bottom">
      <div class="status" id="status"></div>
      <div class="meter" id="meterWrap" hidden><div id="meter"></div></div>
      <button id="rec">● Sprechen</button>
    </div>
  </section>

  <section id="screenFb" hidden>
    <div class="fbword" id="fbWord"></div>
    <div class="verdict" id="verdict"></div>
    <div class="fbtext" id="fbText"></div>
    <canvas id="plot"></canvas>
    <div class="legend"><span><i></i>Dein Verlauf</span><span id="legTarget"><i class="t"></i>So wäre es sehr gut</span><span id="legWhere" hidden><i class="w"></i>hier</span></div>
    <div class="row"><button class="btn" id="again">Nochmal versuchen</button><button class="btn" id="next">Überspringen ▸</button></div>
  </section>

  <section id="screenSet" class="set" hidden>
    <div class="row"><button class="btn" id="back">‹ Zurück</button></div>
    <label for="strictness">Strenge</label>
    <select id="strictness"><option value="streng">Streng (wie ein Logopäde)</option><option value="normal">Normal</option></select>
    <label for="wordsText">Wörter (ein Wort pro Zeile, Silben mit | trennen, # = Überschrift)</label>
    <textarea id="wordsText" spellcheck="false"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="resetWords">Zurücksetzen</button><button class="btn primary" id="saveWords">Speichern</button></div>
    <label class="small"><input type="checkbox" id="shuffle" checked> zufällige Reihenfolge</label>
  </section>
</main>

const ANALYSIS_SR = 22050, HOP_SEC = 0.005, FRAME_N = 512, NB = 16;

  if (!al || al.conf < 0.6) { parts.forEach((p, s) => chunks.push({ label: p, t0: sylT[s][0], t1: sylT[s][1], syl: s })); return chunks; }
  let li = 0; const phs = al.seg.map((sg) => { let s = ends.findIndex((e) => li < e); if (s < 0) s = parts.length - 1; li += sg.g.length; return { ...sg, syl: s }; });
  parts.forEach((p, s) => {
    const [s0, s1] = sylT[s];
    if (s > 0) { chunks.push({ label: p, t0: s0, t1: s1, syl: s }); return; }   // Rest: je Silbe ein Block
    let curC = null; const list = [];
    for (const ph of phs.filter((x) => x.syl === 0)) {
      const a = clamp(ph.t0, s0, s1), b = clamp(ph.t1, s0, s1), son = SONOR.includes(ph.c);
      if (!ph.g) { if (curC) curC.t1 = b; continue; }
      if (curC && ((son && curC.son) || curC.glue)) { curC.label += ph.g; curC.t1 = b; curC.son = curC.son || son; curC.glue = false; }
      else { curC = { label: ph.g, t0: a, t1: b, syl: 0, son, glue: (ph.c === 'P' || ph.c === 'B') && b - a > 0.3 }; list.push(curC); }   // langer „Verschluss“ = eigentlich mit dem nächsten Laut verschmolzen
    }
    if (!list.length) { chunks.push({ label: p, t0: s0, t1: s1, syl: 0 }); return; }
    list.forEach((c, k) => { c.t0 = k ? list[k - 1].t1 : s0; }); list[list.length - 1].t1 = s1;
    chunks.push(...list.filter((c) => c.t1 > c.t0));

}
const chunkAt = (ch, x) => { let best = 0, bd = Infinity; ch.forEach((c, i) => { const d = x < c.t0 ? c.t0 - x : x > c.t1 ? x - c.t1 : 0; if (d < bd) { bd = d; best = i; } }); return best; };
function issueWhere(item, t, ch, word) {
  const p = t.profile || {}, q = p.pitch || {}, lab = (i) => `„${ch[i].label}“`, tm = (x) => fmt(Math.max(0, x - t.tOn), 1);
  const at = (x, pre = 'bei') => { const i = chunkAt(ch, x); return { idx: [i], text: `${pre} ${lab(i)}, nach ca. ${tm(x)} s`, time: x }; };
  const syl0 = ch.map((c, i) => (c.syl === 0 ? i : -1)).filter((i) => i >= 0), rest = ch.map((c, i) => (c.syl > 0 ? i : -1)).filter((i) => i >= 0);
  const syl0Text = word.syl > 1 ? `in der gedehnten Silbe „${word.parts[0]}“` : '';
  switch (item.key) {
    case 'hard': return { idx: [0], text: `am Anfang, bei ${lab(0)}` };
    case 'pitch': return q.jumpAts && q.jumpAts.length ? at(q.jumpAts[0]) : { idx: syl0, text: syl0Text };
    case 'voicebreak': return p.breakAt != null ? at(p.breakAt) : null;
    case 'rough': return p.roughAt != null ? at(p.roughAt) : null;
    case 'air': case 'fade': return at(Math.max(t.tOn, t.tSlowEnd - 0.2), 'gegen Ende, bei');
    case 'break': { const b = t.breaks.find((x) => x[1] - x[0] >= LIMITS.BREAK_FAIL_SEC); return b ? at(b[0]) : null; }
    case 'rest': case 'restslow': return rest.length ? { idx: rest, text: `im Rest „${word.parts.slice(1).join('')}“` } : null;
    case 'whole': return { idx: ch.map((_, i) => i), text: '' };
    default: return { idx: syl0, text: syl0Text };   // Dauer, flach, zackig: betrifft die gedehnte Silbe
  }
}

// Zielkurve: so müsste es bei dir aussehen – Dauer in den Zielbereich, leise anfangen, gleichmäßig lauter werden (Anstieg wie im CD-Vorbild)
function targetCurve(t, j, word) {
  const lo = j.lo, hi = j.hi; let Tend = t.slowDur;
  if (Tend < lo) Tend = lo + 0.25 * (hi - lo); else if (Tend > hi) Tend = hi - 0.25 * (hi - lo);
  const s = word.ref ? clamp(word.ref.slope, 3, 8) : 5;                       // dB pro Sekunde
  let pk = 0; for (let i = 0; i < t.n; i++) { const tt = t.t0 + i * t.dt; if (tt >= t.tOn && tt <= t.tSlowEnd) pk = Math.max(pk, t.A[i]); }
  const P = t.slowDur >= 0.5 * lo ? clamp(pk / t.Amax, 0.5, 1) : 1, pts = [];   // zu kurze Dehnung: Ziel auf deine höchste Lautstärke beziehen
  for (let x = 0; x <= Tend + 0.25; x += 0.02) {
    let a = x <= Tend ? P * Math.pow(10, -s * (Tend - x) / 20) : P * Math.max(0, 1 - (x - Tend) / 0.25);
    if (x < 0.06) a *= x / 0.06; pts.push([x, a]);
  }
  return { pts, Tend };
}
function drawPlot(t, j, word, ch, marks, markT) {
  const c = $('plot'), dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight; if (!W) return;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.documentElement), col = (n) => css.getPropertyValue(n).trim();
  const tg = targetCurve(t, j, word), padL = 4, padR = 4, top = 8, bot = 52, tMin = -0.3;
  const tMax = Math.min(8, Math.max(t.tOff - t.tOn, tg.Tend + 0.25) + 0.3), yb = H - bot;
  const X = (s) => padL + ((s - tMin) / (tMax - tMin)) * (W - padL - padR), Y = (a) => yb - clamp(a, 0, 1.08) / 1.08 * (yb - top);
  g.strokeStyle = col('--line'); g.lineWidth = 1; g.beginPath(); g.moveTo(padL, yb); g.lineTo(W - padR, yb); g.stroke();
  // Ziel (dahinter, grün)
  g.beginPath(); g.moveTo(X(0), yb); tg.pts.forEach(([x, a]) => g.lineTo(X(x), Y(a))); g.lineTo(X(tg.pts[tg.pts.length - 1][0]), yb); g.closePath();
  g.fillStyle = col('--targetfill'); g.fill(); g.strokeStyle = col('--target'); g.lineWidth = 2; g.stroke();
  // dein Verlauf (davor, blau)
  g.strokeStyle = col('--accent'); g.lineWidth = 3; g.lineJoin = 'round'; g.beginPath(); let st = false;
  for (let i = 0; i < t.n; i++) { const s = t.t0 + i * t.dt - t.tOn; if (s < tMin || s > tMax) continue; const y = Y(t.A[i] / t.Amax); if (!st) { g.moveTo(X(s), y); st = true; } else g.lineTo(X(s), y); }
  g.stroke();
  if (markT != null) {                                               // genaue Stelle des Fehlers
    const xm = X(markT - t.tOn); g.strokeStyle = 'rgba(234,138,40,.95)'; g.lineWidth = 2; g.setLineDash([5, 4]); g.beginPath(); g.moveTo(xm, top); g.lineTo(xm, yb + 4); g.stroke(); g.setLineDash([]);
  }
  if (ch && ch.length) {                                             // Laut-/Silbenzeile
    const y0 = yb + 6, hh = 22; g.font = '600 13px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    let xPrev = -Infinity;
    ch.forEach((c, i) => {
      g.font = '600 13px system-ui'; const need = g.measureText(c.label).width + 8;                 // kurze Laute (z. B. „T“) bekommen eine Mindestbreite
      const a = Math.max(X(clamp(c.t0 - t.tOn, tMin, tMax)) + 1, xPrev + 2), b = Math.max(X(clamp(c.t1 - t.tOn, tMin, tMax)) - 1, a + need); xPrev = b;
      const hit = marks && marks.has(i);
      g.fillStyle = hit ? 'rgba(234,138,40,.55)' : col('--line'); g.beginPath(); g.roundRect ? g.roundRect(a, y0, b - a, hh, 5) : g.rect(a, y0, b - a, hh); g.fill();
      g.fillStyle = col('--ink'); if (g.measureText(c.label).width < b - a - 2) g.fillText(c.label, (a + b) / 2, y0 + hh / 2 + 1);
    });
    g.textBaseline = 'alphabetic';
  }
  g.fillStyle = col('--muted'); g.font = '11px system-ui'; g.textAlign = 'center';
  for (let s = 0; s <= tMax; s += 1) g.fillText(s + ' s', X(s), H - 6);
}
window.addEventListener('resize', () => { if (lastResult && !$('screenFb').hidden) drawPlot(lastResult.t, lastResult.j, lastResult.word, lastResult.ch, lastResult.j.pass ? new Set() : lastResult.marks, lastResult.markT); });

$('strictness').addEventListener('change', () => { store.set('dehn_strict', $('strictness').value); applyStrictness($('strictness').value); });
loadWords(); nextWord(); setRecUI('idle');
window.__app = { cur: () => cur, last: () => lastResult, words: () => words };   // nur zum Testen
